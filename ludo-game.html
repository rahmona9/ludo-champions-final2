<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لودو الأبطال</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1f5f4a;--fg:#fff;--card:#fffdf6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14352b}}
:root[data-theme="dark"]{--bg:#14352b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:repeating-linear-gradient(90deg,#0005 0 2px,#0000 2px 76px),repeating-linear-gradient(0deg,#ffffff10 0 1px,#0000 1px 6px),repeating-linear-gradient(90deg,#a9713a 0 76px,#94602d 76px 152px,#a06a35 152px 228px);background-attachment:fixed;color:#fff;text-shadow:0 1px 3px #000a;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;min-height:100%}
#bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:520px}
.pl{background:#0004;border:2px solid transparent;border-radius:12px;padding:6px 2px;text-align:center;font-size:13px;font-weight:700;transition:.2s}
.pl i{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto 3px;box-shadow:inset 0 -3px 4px #0005,0 1px 3px #0008}
.pl.on{border-color:#ffd54f;background:#0008;transform:scale(1.06)}
#bd{position:relative;width:100%;max-width:520px}:root{--d:40px}canvas{width:100%;display:block;aspect-ratio:1;border-radius:16px;box-shadow:0 10px 30px #000a;touch-action:manipulation}
#ctl{display:flex;gap:14px;align-items:center}
#rb{font:inherit;font-weight:800;font-size:18px;padding:14px 26px;border:0;border-radius:14px;color:#fff;background:linear-gradient(#ffb300,#e65100);box-shadow:0 5px 0 #8d3a00,0 8px 14px #0007}
#rb:active{transform:translateY(4px);box-shadow:0 1px 0 #8d3a00}
#rb:disabled{filter:grayscale(.8);opacity:.5}
#log{font-size:15px;min-height:42px;text-align:center;max-width:520px;font-weight:600}
#rw{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:16px;z-index:9}
#rwb{background:var(--card);color:#222;padding:20px;border-radius:20px;display:flex;flex-direction:column;gap:10px;width:min(340px,100%);text-align:center;box-shadow:0 0 40px #ffd54f88;animation:pop .35s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#rwb h2{margin:0;font-size:22px}
#rwb button{font:inherit;font-weight:700;padding:13px;border:0;border-radius:12px;background:linear-gradient(#ab47bc,#6a1b9a);color:#fff;box-shadow:0 3px 0 #38006b}
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:repeating-linear-gradient(90deg,#0005 0 2px,#0000 2px 76px),repeating-linear-gradient(90deg,#a9713a 0 76px,#94602d 76px 152px,#a06a35 152px 228px)}
#mb{background:#fffaf0ee;color:#3b2410;text-shadow:none;border:6px solid #5e3a18;border-radius:22px;padding:20px;width:min(380px,100%);display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 12px 40px #000a}
#mb h1{margin:0;font-size:30px}#mb p{margin:0;font-size:14px}
.mr{display:flex;align-items:center;gap:10px;font:inherit;font-weight:700;padding:10px 14px;border:2px solid #5e3a18;border-radius:12px;background:#fff;color:#3b2410}
.mr i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 -3px 4px #0005}.mr span{margin-inline-start:auto}
.row{display:flex;gap:8px}.row button{flex:1;font:inherit;font-weight:700;padding:10px 4px;border:0;border-radius:10px;background:#5e3a18;color:#fff}
#go{font:inherit;font-weight:800;font-size:20px;padding:14px;border:0;border-radius:14px;color:#fff;background:linear-gradient(#43a047,#1b5e20);box-shadow:0 5px 0 #0d3b10}
#nb{font:inherit;font-weight:700;padding:8px 16px;border:0;border-radius:10px;background:#0006;color:#fff}
#cube{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.f{position:absolute;inset:-.6px;border-radius:2px;background:linear-gradient(145deg,#fffef8,#e2ddd0);border:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;gap:2%;backface-visibility:hidden;box-shadow:inset 0 0 0 1.5px #fff9,inset 0 0 7px #0004}
.f b{border-radius:50%}.f b.d{background:radial-gradient(circle at 35% 30%,#555,#000);box-shadow:inset 0 1px 2px #000a,0 0 0 1px #0002}

#sh{position:absolute;left:50%;top:50%;width:var(--d);height:calc(var(--d)*.6);margin:calc(var(--d)/-2) 0 0 calc(var(--d)/-2);background:radial-gradient(#000c,#0000 70%);pointer-events:none;z-index:4}.pg{height:5px;background:#0006;border-radius:3px;overflow:hidden;margin-top:3px}.pg u{display:block;height:100%;transition:width .4s}#tm{font-size:12px;font-weight:700}#gl{border-radius:0;box-shadow:none;max-width:none;aspect-ratio:auto;position:absolute;left:50%;top:50%;width:calc(var(--d)*1.8);height:calc(var(--d)*1.8);margin:calc(var(--d)*-.9) 0 0 calc(var(--d)*-.9);pointer-events:none}#dice.ready::before{content:'';position:absolute;inset:-5px;border-radius:50%;animation:rg 1s infinite}@keyframes rg{0%,100%{box-shadow:0 0 0 2px var(--rc,#ffd54f),0 0 10px var(--rc,#ffd54f)}50%{box-shadow:0 0 0 4px #fff,0 0 22px var(--rc,#ffd54f)}}.sec{font-weight:700;text-align:start;margin-top:4px}.cr{display:flex;gap:6px}.cr button{flex:1;padding:12px 4px}#hint{font-size:13px;opacity:.9}
:root{--bs:max(min(100vw - 8px,460px),min(100vw - 8px,100vh - 175px,1000px))}
:root{--bs:max(min(100vw - 8px,460px),min(100vw - 8px,100svh - 175px,1000px))}
#bd,#bar{width:var(--bs);max-width:none}#log,#hint{max-width:var(--bs)}
.pl{font-size:12px;padding:4px 2px}.pl i{width:14px;height:14px;margin-bottom:1px}.pg{height:4px;margin-top:2px}#log{font-size:13px;min-height:0}#hint{font-size:11px}#nb{font-size:12px;padding:5px 12px}#tm{display:none}
#ct{display:none!important}</style>
